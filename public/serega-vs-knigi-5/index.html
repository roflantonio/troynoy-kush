<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Серёга против книг 5</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="movement.js"></script>
  <script defer src="runtime.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
<main id="game" aria-label="Серёга против книг 5">
  <div id="stage">
    <div id="media" aria-hidden="true">
      <canvas id="scene" width="1280" height="720"></canvas>
    </div>
    <div id="targets"></div>
    <div id="controls" aria-label="Сенсорное управление" hidden>
      <div id="directions"></div>
      <div id="actions"></div>
    </div>
    <section id="notice" aria-live="polite">
      <h1>Серёга против книг 5</h1>
      <p></p>
      <button id="confirm" type="button">Играть</button>
    </section>
  </div>
  <dialog id="debug" aria-labelledby="debug-title">
    <form id="debug-form">
      <h2 id="debug-title">Отладка сцен</h2>
      <label for="debug-scene">Сцена</label>
      <select id="debug-scene" autofocus></select>
      <div class="debug-buttons">
        <button type="button" id="debug-close">Закрыть</button>
        <button type="submit">Открыть сцену</button>
      </div>
    </form>
  </dialog>
</main>
</body>
</html>
